<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- ResearchCompass 头像：圆形罗盘 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#035065"/>
      <stop offset="100%" stop-color="#023944"/>
    </linearGradient>
    <linearGradient id="needleRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4f"/>
      <stop offset="100%" stop-color="#cf1322"/>
    </linearGradient>
  </defs>

  <!-- 圆形底 -->
  <circle cx="128" cy="128" r="128" fill="url(#bgGrad)"/>

  <!-- 罗盘外圈 -->
  <circle cx="128" cy="128" r="118" fill="none" stroke="#a3d8e8" stroke-width="2" opacity="0.6"/>
  <circle cx="128" cy="128" r="108" fill="none" stroke="#5faec2" stroke-width="1.5" opacity="0.5"/>

  <!-- 主刻度（N/E/S/W） -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <line x1="128" y1="30" x2="128" y2="50"/>
    <line x1="128" y1="206" x2="128" y2="226"/>
    <line x1="30" y1="128" x2="50" y2="128"/>
    <line x1="206" y1="128" x2="226" y2="128"/>
  </g>

  <!-- 副刻度（4 角） -->
  <g stroke="#82c3d6" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="65" y1="65" x2="78" y2="78"/>
    <line x1="178" y1="178" x2="191" y2="191"/>
    <line x1="191" y1="65" x2="178" y2="78"/>
    <line x1="78" y1="178" x2="65" y2="191"/>
  </g>

  <!-- N 字母 -->
  <text x="128" y="74" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#ffffff">N</text>

  <!-- 指南针指针 -->
  <g transform="translate(128 128)">
    <polygon points="0,-72 16,0 0,12 -16,0" fill="url(#needleRed)"/>
    <polygon points="0,72 16,0 0,-12 -16,0" fill="#ffffff"/>
  </g>

  <!-- 中心轴 -->
  <circle cx="128" cy="128" r="10" fill="#023944" stroke="#ffffff" stroke-width="3"/>
  <circle cx="128" cy="128" r="4" fill="#046a82"/>
</svg>
