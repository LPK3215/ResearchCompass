<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <!-- ResearchCompass 登录页背景：青蓝渐变 + 学术元素 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01151f"/>
      <stop offset="40%" stop-color="#023944"/>
      <stop offset="100%" stop-color="#035065"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3996ae" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#01151f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5faec2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5faec2" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5faec2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 主背景 -->
  <rect width="1200" height="900" fill="url(#bgGrad)"/>
  <rect width="1200" height="900" fill="url(#glowGrad)"/>

  <!-- 网格点：象征知识节点 -->
  <g fill="#82c3d6" opacity="0.25">
    <circle cx="120" cy="180" r="3"/>
    <circle cx="220" cy="240" r="2.5"/>
    <circle cx="320" cy="180" r="3"/>
    <circle cx="180" cy="320" r="2.5"/>
    <circle cx="280" cy="380" r="3"/>
    <circle cx="120" cy="460" r="2.5"/>
    <circle cx="220" cy="520" r="3"/>
    <circle cx="80" cy="620" r="2.5"/>
    <circle cx="180" cy="700" r="3"/>
    <circle cx="280" cy="640" r="2.5"/>

    <circle cx="900" cy="180" r="3"/>
    <circle cx="1000" cy="240" r="2.5"/>
    <circle cx="1080" cy="180" r="3"/>
    <circle cx="950" cy="320" r="2.5"/>
    <circle cx="1050" cy="380" r="3"/>
    <circle cx="900" cy="460" r="2.5"/>
    <circle cx="1000" cy="520" r="3"/>
    <circle cx="1080" cy="620" r="2.5"/>
    <circle cx="950" cy="700" r="3"/>
    <circle cx="1050" cy="780" r="2.5"/>
  </g>

  <!-- 连接线：象征知识图谱 -->
  <g stroke="url(#lineGrad)" stroke-width="1.2" fill="none" opacity="0.6">
    <line x1="120" y1="180" x2="220" y2="240"/>
    <line x1="220" y1="240" x2="320" y2="180"/>
    <line x1="220" y1="240" x2="180" y2="320"/>
    <line x1="180" y1="320" x2="280" y2="380"/>
    <line x1="180" y1="320" x2="120" y2="460"/>
    <line x1="120" y1="460" x2="220" y2="520"/>
    <line x1="220" y1="520" x2="80" y2="620"/>
    <line x1="80" y1="620" x2="180" y2="700"/>
    <line x1="180" y1="700" x2="280" y2="640"/>

    <line x1="900" y1="180" x2="1000" y2="240"/>
    <line x1="1000" y1="240" x2="1080" y2="180"/>
    <line x1="1000" y1="240" x2="950" y2="320"/>
    <line x1="950" y1="320" x2="1050" y2="380"/>
    <line x1="950" y1="320" x2="900" y2="460"/>
    <line x1="900" y1="460" x2="1000" y2="520"/>
    <line x1="1000" y1="520" x2="1080" y2="620"/>
    <line x1="1080" y1="620" x2="950" y2="700"/>
    <line x1="950" y1="700" x2="1050" y2="780"/>
  </g>

  <!-- 中央大罗盘水印 -->
  <g transform="translate(600 450)" opacity="0.12">
    <circle cx="0" cy="0" r="320" fill="none" stroke="#a3d8e8" stroke-width="3"/>
    <circle cx="0" cy="0" r="280" fill="none" stroke="#a3d8e8" stroke-width="2"/>
    <circle cx="0" cy="0" r="240" fill="none" stroke="#a3d8e8" stroke-width="1.5"/>
    <!-- 罗盘刻度 -->
    <g stroke="#a3d8e8" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-320" x2="0" y2="-280"/>
      <line x1="0" y1="280" x2="0" y2="320"/>
      <line x1="-320" y1="0" x2="-280" y2="0"/>
      <line x1="280" y1="0" x2="320" y2="0"/>
    </g>
    <!-- 指针 -->
    <polygon points="0,-220 50,0 0,40 -50,0" fill="#ff4d4f"/>
    <polygon points="0,220 50,0 0,-40 -50,0" fill="#ffffff"/>
    <circle cx="0" cy="0" r="20" fill="#023944" stroke="#ffffff" stroke-width="4"/>
  </g>

  <!-- 论文文档剪影 -->
  <g transform="translate(820 250)" opacity="0.18">
    <rect x="0" y="0" width="140" height="180" rx="6" fill="#ffffff"/>
    <rect x="14" y="20" width="100" height="6" fill="#3996ae"/>
    <rect x="14" y="36" width="112" height="3" fill="#5faec2"/>
    <rect x="14" y="46" width="112" height="3" fill="#5faec2"/>
    <rect x="14" y="56" width="80" height="3" fill="#5faec2"/>
    <rect x="14" y="76" width="112" height="3" fill="#5faec2"/>
    <rect x="14" y="86" width="112" height="3" fill="#5faec2"/>
    <rect x="14" y="96" width="60" height="3" fill="#5faec2"/>
  </g>
  <g transform="translate(220 600)" opacity="0.15">
    <rect x="0" y="0" width="120" height="160" rx="6" fill="#ffffff"/>
    <rect x="12" y="18" width="86" height="5" fill="#3996ae"/>
    <rect x="12" y="32" width="96" height="3" fill="#5faec2"/>
    <rect x="12" y="42" width="96" height="3" fill="#5faec2"/>
    <rect x="12" y="52" width="70" height="3" fill="#5faec2"/>
    <rect x="12" y="70" width="96" height="3" fill="#5faec2"/>
    <rect x="12" y="80" width="50" height="3" fill="#5faec2"/>
  </g>

  <!-- 顶部标题文字 -->
  <text x="600" y="120" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="42" font-weight="700" fill="#ffffff" opacity="0.92">ResearchCompass</text>
  <text x="600" y="158" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="400" fill="#a3d8e8" opacity="0.85">科研罗盘 · 学术文献智能分析平台</text>

  <!-- 底部标语 -->
  <text x="600" y="820" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" font-weight="300" fill="#82c3d6" opacity="0.75" letter-spacing="2">让学术证据可检索 · 可分析 · 可验证</text>
</svg>
