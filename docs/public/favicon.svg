<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- ResearchCompass 科研罗盘 favicon -->
  <!-- 外圈：罗盘边框 -->
  <circle cx="64" cy="64" r="60" fill="#046a82"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#023944" stroke-width="2"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="#a3d8e8" stroke-width="1.5" opacity="0.7"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#5faec2" stroke-width="1" opacity="0.5"/>

  <!-- 罗盘刻度（N/E/S/W + 4个角） -->
  <g stroke="#e1f6fb" stroke-width="2.5" stroke-linecap="round">
    <line x1="64" y1="14" x2="64" y2="24"/>
    <line x1="64" y1="104" x2="64" y2="114"/>
    <line x1="14" y1="64" x2="24" y2="64"/>
    <line x1="104" y1="64" x2="114" y2="64"/>
  </g>
  <g stroke="#82c3d6" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
    <line x1="35.5" y1="35.5" x2="42" y2="42"/>
    <line x1="86" y1="86" x2="92.5" y2="92.5"/>
    <line x1="92.5" y1="35.5" x2="86" y2="42"/>
    <line x1="42" y1="86" x2="35.5" y2="92.5"/>
  </g>

  <!-- 字母标记 N -->
  <text x="64" y="34" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ffffff">N</text>

  <!-- 指南针指针：红北白南 -->
  <g transform="translate(64 64)">
    <!-- 北向指针（红） -->
    <polygon points="0,-36 8,0 0,6 -8,0" fill="#ff4d4f"/>
    <polygon points="0,-36 -8,0 0,6 8,0" fill="#ff8082"/>
    <!-- 南向指针（白） -->
    <polygon points="0,36 8,0 0,-6 -8,0" fill="#ffffff"/>
    <polygon points="0,36 -8,0 0,-6 8,0" fill="#e4e6e6"/>
  </g>

  <!-- 中心轴 -->
  <circle cx="64" cy="64" r="5" fill="#023944" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="2" fill="#046a82"/>

  <!-- 学术书本小标：象征科研 -->
  <g transform="translate(40 96)" opacity="0.85">
    <rect x="0" y="0" width="48" height="6" rx="1" fill="#a3d8e8"/>
    <rect x="2" y="-2" width="44" height="2" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
